<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 제어 센터</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --primary: #4f46e5; --primary-hover: #4338ca;
      --bg: #0b0f19; --card-bg: #1e293b; --card-border: #334155;
      --text: #f8fafc; --text-muted: #94a3b8;
      --danger: #ef4444; --success: #10b981; --gold: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1300px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
    .btn { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }
    .btn-undo { background: #64748b; }
    input, select { background: #0f172a; border: 1px solid var(--card-border); color: var(--text); padding: 8px 10px; border-radius: 6px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid var(--card-border); }
    #admin-lock { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; }
  </style>
</head>
<body>

<!-- 비밀번호 잠금 화면 -->
<div id="admin-lock">
  <div class="card" style="text-align: center; width: 320px;">
    <h2 style="margin-bottom: 15px;">🔒 관리자 인증</h2>
    <input type="password" id="pin-input" placeholder="비밀번호 입력 (기본: 1234)" style="width: 100%; margin-bottom: 10px;">
    <button class="btn" style="width: 100%;" onclick="unlockAdmin()">입장하기</button>
  </div>
</div>

<div class="container">
  <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2>⚙️ 스코어보드 관리자 콘솔</h2>
    <div>
      <button class="btn btn-undo" onclick="undoState()">↩ 되돌리기 (Undo)</button>
      <button class="btn btn-danger" onclick="resetData()">데이터 전체 리셋</button>
    </div>
  </header>

  <!-- 상단 실시간 모니터링 축약 뷰 -->
  <div class="card" style="border-color: var(--primary);">
    <h3>📊 실시간 현황 모니터링 (사용자 화면 동기화 중)</h3>
    <div id="live-ranking-bar" style="margin-top: 10px; font-weight: 600; color: var(--gold);"></div>
  </div>

  <!-- 점수 배점 설정 -->
  <div class="card">
    <h3>등수별 기본 획득 점수 규칙</h3>
    <div style="display: flex; gap: 12px; margin-top: 8px;">
      <label>🥇 1등: <input type="number" id="rule-p1" style="width: 80px;"></label>
      <label>🥈 2등: <input type="number" id="rule-p2" style="width: 80px;"></label>
      <label>🥉 3등: <input type="number" id="rule-p3" style="width: 80px;"></label>
      <button class="btn" onclick="saveRules()">규칙 저장</button>
    </div>
  </div>

  <!-- 게임별 순위 선정 및 일괄 합산 -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>게임별 순위 선정 및 일괄 합산</h3>
      <button class="btn btn-success" onclick="batchCalculateScores()">⚡ 점수 일괄합산 적용</button>
    </div>
    <div id="game-selection-list" style="margin-top: 12px;"></div>
  </div>

  <!-- 추가/감점 즉시 반영 -->
  <div class="card">
    <h3>추가 점수 / 감점 부여</h3>
    <div style="display: flex; gap: 10px; margin-top: 8px;">
      <select id="quick-team"></select>
      <input type="number" id="quick-pts" placeholder="점수 (+50 또는 -30)">
      <button class="btn" onclick="applyQuickScore()">점수 즉시 반영</button>
    </div>
  </div>

  <!-- 조 및 게임 관리 그리드 -->
  <div class="grid-2">
    <div class="card">
      <h3>조(팀) 관리</h3>
      <div style="display: flex; gap: 6px; margin: 10px 0;">
        <input type="text" id="new-team-name" placeholder="신규 팀명">
        <button class="btn" onclick="addTeam()">추가</button>
      </div>
      <table id="team-table"><tbody></tbody></table>
    </div>

    <div class="card">
      <h3>게임 관리</h3>
      <div style="display: flex; gap: 6px; margin: 10px 0;">
        <input type="text" id="new-game-name" placeholder="신규 게임명">
        <button class="btn" onclick="addGame()">추가</button>
      </div>
      <table id="game-table"><tbody></tbody></table>
    </div>
  </div>
</div>

<script>
  // 1. Firebase 설정
  const firebaseConfig = {
    apiKey: "AIzaSyDdW4Nu4mCgOoF2152ZImcgb-v6wp-hiiI",
    authDomain: "adult-scoreboard.firebaseapp.com",
    databaseURL: "https://adult-scoreboard-default-rtdb.firebaseio.com",
    projectId: "adult-scoreboard",
    storageBucket: "adult-scoreboard.firebasestorage.app",
    messagingSenderId: "941156687343",
    appId: "1:941156687343:web:31c344c0110c59d62d2a1a",
    measurementId: "G-NGBSSPGHDG"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const defaultState = {
    rules: { p1: 100, p2: 70, p3: 40 },
    teams: [{ id: 1, name: "1조", score: 0 }, { id: 2, name: "2조", score: 0 }, { id: 3, name: "3조", score: 0 }, { id: 4, name: "4조", score: 0 }],
    games: [{ id: 1, name: "줄다리기", rank1: null, rank2: null, rank3: null }]
  };

  let currentState = null;
  let backupState = null;

  // 관리자 비밀번호 검증 (필요시 변경)
  function unlockAdmin() {
    if (document.getElementById('pin-input').value === '1234') {
      document.getElementById('admin-lock').style.display = 'none';
    } else {
      alert("비밀번호가 올바르지 않습니다.");
    }
  }

  // 실시간 구독
  db.ref('scoreboard').on('value', (snapshot) => {
    const val = snapshot.val();
    if (!val) {
      db.ref('scoreboard').set(defaultState);
      return;
    }
    currentState = val;
    renderAdmin();
  });

  function updateDB(createUndo = false) {
    if (createUndo && currentState) {
      backupState = JSON.parse(JSON.stringify(currentState));
    }
    db.ref('scoreboard').set(currentState);
  }

  function undoState() {
    if (!backupState) return alert("되돌릴 이전 작업 내역이 없습니다.");
    currentState = JSON.parse(JSON.stringify(backupState));
    backupState = null;
    db.ref('scoreboard').set(currentState);
    alert("이전 상태로 되돌렸습니다.");
  }

  function renderAdmin() {
    const teams = currentState.teams || [];
    const games = currentState.games || [];

    // 실시간 모니터링 바
    const sorted = [...teams].sort((a,b) => b.score - a.score);
    document.getElementById('live-ranking-bar').innerHTML = sorted.map((t, idx) => 
      `${idx + 1}위: <strong>${t.name}</strong>(${t.score}P)`
    ).join(' | ');

    // 규칙 인풋
    document.getElementById('rule-p1').value = currentState.rules.p1;
    document.getElementById('rule-p2').value = currentState.rules.p2;
    document.getElementById('rule-p3').value = currentState.rules.p3;

    // 즉시 점수 부여 드롭다운
    document.getElementById('quick-team').innerHTML = teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');

    // 팀 관리 테이블
    document.querySelector('#team-table tbody').innerHTML = teams.map(t => `
      <tr>
        <td><input type="text" value="${t.name}" onchange="editTeamName(${t.id}, this.value)"></td>
        <td>${t.score} P</td>
        <td><button class="btn btn-danger" onclick="deleteTeam(${t.id})">삭제</button></td>
      </tr>
    `).join('');

    // 게임 관리 테이블
    document.querySelector('#game-table tbody').innerHTML = games.map(g => `
      <tr>
        <td><input type="text" value="${g.name}" onchange="editGameName(${g.id}, this.value)"></td>
        <td><button class="btn btn-danger" onclick="deleteGame(${g.id})">삭제</button></td>
      </tr>
    `).join('');

    // 게임별 순위 드롭다운
    const teamOpts = `<option value="">--선택--</option>` + teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    document.getElementById('game-selection-list').innerHTML = games.map(g => `
      <div style="border: 1px solid var(--card-border); padding: 10px; border-radius: 8px; margin-bottom: 8px;">
        <strong>🎮 ${g.name}</strong>
        <div style="margin-top: 6px; display: flex; gap: 10px;">
          <label>🥇 1위: <select onchange="setGameRank(${g.id}, 'rank1', this.value)">${teamOpts}</select></label>
          <label>🥈 2위: <select onchange="setGameRank(${g.id}, 'rank2', this.value)">${teamOpts}</select></label>
          <label>🥉 3위: <select onchange="setGameRank(${g.id}, 'rank3', this.value)">${teamOpts}</select></label>
        </div>
      </div>
    `).join('');

    // 드롭다운 기선택값 세팅
    games.forEach(g => {
      const boxes = document.querySelectorAll('#game-selection-list div');
      boxes.forEach(box => {
        if (box.innerText.includes(g.name)) {
          const selects = box.querySelectorAll('select');
          if (g.rank1) selects[0].value = g.rank1;
          if (g.rank2) selects[1].value = g.rank2;
          if (g.rank3) selects[2].value = g.rank3;
        }
      });
    });
  }

  /* 관리 액션 로직 */
  function saveRules() {
    currentState.rules = {
      p1: Number(document.getElementById('rule-p1').value),
      p2: Number(document.getElementById('rule-p2').value),
      p3: Number(document.getElementById('rule-p3').value)
    };
    updateDB();
    alert("점수 규칙 저장 완료");
  }

  function setGameRank(gameId, rankKey, value) {
    const g = currentState.games.find(item => item.id === gameId);
    if (g) {
      g[rankKey] = value ? Number(value) : null;
      updateDB();
    }
  }

  function batchCalculateScores() {
    if (!confirm("현재 설정된 1, 2, 3위 팀들에 점수를 일괄 합산하시겠습니까?")) return;
    updateDB(true); // 실행 전 백업 생성

    const rules = currentState.rules;
    currentState.games.forEach(g => {
      if (g.rank1) { const t = currentState.teams.find(x => x.id === g.rank1); if (t) t.score += rules.p1; }
      if (g.rank2) { const t = currentState.teams.find(x => x.id === g.rank2); if (t) t.score += rules.p2; }
      if (g.rank3) { const t = currentState.teams.find(x => x.id === g.rank3); if (t) t.score += rules.p3; }
    });
    updateDB();
    alert("일괄 합산이 반영되었습니다.");
  }

  function applyQuickScore() {
    const tid = Number(document.getElementById('quick-team').value);
    const pts = Number(document.getElementById('quick-pts').value);
    if (isNaN(pts) || pts === 0) return alert("점수를 입력하세요.");

    updateDB(true);
    const t = currentState.teams.find(x => x.id === tid);
    if (t) {
      t.score += pts;
      document.getElementById('quick-pts').value = '';
      updateDB();
      alert(`${t.name}에 ${pts}점이 반영되었습니다.`);
    }
  }

  function addTeam() {
    const input = document.getElementById('new-team-name');
    if (!input.value.trim()) return;
    currentState.teams.push({ id: Date.now(), name: input.value.trim(), score: 0 });
    input.value = '';
    updateDB();
  }

  function editTeamName(id, name) {
    const t = currentState.teams.find(x => x.id === id);
    if (t) { t.name = name; updateDB(); }
  }

  function deleteTeam(id) {
    if (!confirm("팀을 삭제하시겠습니까?")) return;
    currentState.teams = currentState.teams.filter(x => x.id !== id);
    updateDB();
  }

  function addGame() {
    const input = document.getElementById('new-game-name');
    if (!input.value.trim()) return;
    currentState.games.push({ id: Date.now(), name: input.value.trim(), rank1: null, rank2: null, rank3: null });
    input.value = '';
    updateDB();
  }

  function editGameName(id, name) {
    const g = currentState.games.find(x => x.id === id);
    if (g) { g.name = name; updateDB(); }
  }

  function deleteGame(id) {
    if (!confirm("게임을 삭제하시겠습니까?")) return;
    currentState.games = currentState.games.filter(x => x.id !== id);
    updateDB();
  }

  function resetData() {
    if (!confirm("정말 모든 데이터를 초기화하시겠습니까?")) return;
    currentState = JSON.parse(JSON.stringify(defaultState));
    updateDB(true);
  }
</script>
</body>
</html>
