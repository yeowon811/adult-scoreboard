<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 점수 현황판</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #f59e0b;
            --silver: #cbd5e1;
            --bronze: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 30px 16px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: -1px;
        }

        /* 포디움 스타일 */
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .podium-card {
            background: var(--card-bg);
            border-radius: 16px;
            text-align: center;
            padding: 24px;
            width: 260px;
            border: 2px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

            .podium-card.rank-1 {
                height: 270px;
                border-color: var(--gold);
                background: linear-gradient(180deg, rgba(245, 158, 11, 0.15) 0%, var(--card-bg) 100%);
                order: 2;
            }

            .podium-card.rank-2 {
                height: 230px;
                border-color: var(--silver);
                order: 1;
            }

            .podium-card.rank-3 {
                height: 200px;
                border-color: var(--bronze);
                order: 3;
            }

        .badge {
            font-size: 2.5rem;
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
        }

        .team-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 10px;
            word-break: break-all;
        }

        .team-score {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--gold);
            margin-top: 10px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 860px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }

            .podium-container {
                align-items: center;
            }

            .podium-card.rank-1 {
                order: 1;
                height: 220px;
            }

            .podium-card.rank-2 {
                order: 2;
                height: 200px;
            }

            .podium-card.rank-3 {
                order: 3;
                height: 180px;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 24px;
        }

            .card h2 {
                font-size: 1.3rem;
                margin-bottom: 16px;
                border-bottom: 1px solid var(--card-border);
                padding-bottom: 10px;
            }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--card-border);
            font-size: 1.05rem;
        }

        th {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 실시간 점수 현황판</h1>
        </header>

        <div class="podium-container" id="podium-area"></div>

        <div class="grid-2">
            <div class="card">
                <h2>전체 순위 리스트</h2>
                <table>
                    <thead>
                        <tr>
                            <th style="width: 80px;">순위</th>
                            <th>조 이름</th>
                            <th style="text-align: right;">총점</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-tbody">
                        <tr><td colspan="3" class="empty-state">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="card">
                <h2>게임별 1, 2, 3위 결과</h2>
                <div id="game-results-list">
                    <div class="empty-state">등록된 게임 결과가 없습니다.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDdW4Nu4mCgOoF2152ZImcgb-v6wp-hiiI",
            authDomain: "adult-scoreboard.firebaseapp.com",
            databaseURL: "https://adult-scoreboard-default-rtdb.firebaseio.com",
            projectId: "adult-scoreboard",
            storageBucket: "adult-scoreboard.firebasestorage.app",
            messagingSenderId: "941156687343",
            appId: "1:941156687343:web:31c344c0110c59d62d2a1a",
            measurementId: "G-NGBSSPGHDG"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('scoreboard').on('value', (snapshot) => {
            const state = snapshot.val();
            if (!state) {
                renderEmpty();
                return;
            }
            render(state);
        });

        function toArray(data) {
            if (!data) return [];
            return Array.isArray(data) ? data : Object.values(data);
        }

        function renderEmpty() {
            document.getElementById('podium-area').innerHTML = '';
            document.getElementById('leaderboard-tbody').innerHTML = '<tr><td colspan="3" class="empty-state">팀 정보가 없습니다.</td></tr>';
            document.getElementById('game-results-list').innerHTML = '<div class="empty-state">등록된 게임 결과가 없습니다.</div>';
        }

        function render(state) {
            const rawTeams = toArray(state.teams);
            const games = toArray(state.games);

            // 점수 정렬 (숫자 변환 방어 처리)
            const sortedTeams = [...rawTeams].sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0));

            // 포디움 렌더링
            const podiumOrder = [
                { rank: 2, team: sortedTeams[1], badge: '🥈', cls: 'rank-2' },
                { rank: 1, team: sortedTeams[0], badge: '🥇', cls: 'rank-1' },
                { rank: 3, team: sortedTeams[2], badge: '🥉', cls: 'rank-3' }
            ];

            document.getElementById('podium-area').innerHTML = podiumOrder.map(item => `
          <div class="podium-card ${item.cls}">
            <span class="badge">${item.badge}</span>
            <div class="team-title">${item.team ? item.team.name : '-'}</div>
            <div class="team-score">${item.team ? (Number(item.team.score) || 0).toLocaleString() + 'P' : '0P'}</div>
          </div>
        `).join('');

            // 순위표 렌더링
            const leaderboardBody = document.getElementById('leaderboard-tbody');
            if (sortedTeams.length === 0) {
                leaderboardBody.innerHTML = '<tr><td colspan="3" class="empty-state">팀 정보가 없습니다.</td></tr>';
            } else {
                leaderboardBody.innerHTML = sortedTeams.map((team, idx) => `
            <tr>
              <td><strong>${idx + 1}위</strong></td>
              <td>${team.name || '미등록'}</td>
              <td style="text-align: right; color: var(--gold); font-weight: 800;">${(Number(team.score) || 0).toLocaleString()} P</td>
            </tr>
          `).join('');
            }

            // 게임별 순위 렌더링
            const gameResultsList = document.getElementById('game-results-list');
            if (games.length === 0) {
                gameResultsList.innerHTML = '<div class="empty-state">등록된 게임 결과가 없습니다.</div>';
            } else {
                gameResultsList.innerHTML = games.map(g => {
                    const findTeam = (rankId) => rawTeams.find(t => String(t.id) === String(rankId));
                    const t1 = findTeam(g.rank1);
                    const t2 = findTeam(g.rank2);
                    const t3 = findTeam(g.rank3);

                    return `
              <div style="padding: 12px 0; border-bottom: 1px solid var(--card-border);">
                <strong style="font-size: 1.05rem;">🎮 ${g.name || '게임'}</strong>
                <div style="margin-top: 4px; color: var(--text-muted); font-size: 0.95rem;">
                  🥇 1위: <span style="color: var(--text); font-weight: 600;">${t1 ? t1.name : '-'}</span> |
                  🥈 2위: <span style="color: var(--text); font-weight: 600;">${t2 ? t2.name : '-'}</span> |
                  🥉 3위: <span style="color: var(--text); font-weight: 600;">${t3 ? t3.name : '-'}</span>
                </div>
              </div>
            `;
                }).join('');
            }
        }
    </script>
</body>
</html>
